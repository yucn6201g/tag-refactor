# CI for tag-refactor (U1, U2). It never calls AWS and holds no AWS credentials.
# Branch protection requires only the ci-gate job.
#
# v0.2.0 U1: the jobs that run the Go tests install Node.js and the test CDK app
# (npm ci), because the tests run cdk synth and the helper on all three systems
# and fail when the tools are missing (NFR8.1). The token of the test-only
# repository reaches one step only: the GitHub integration test of github-pr
# (security design §6).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Never let Go download another toolchain; the matrix decides the version.
  GOTOOLCHAIN: local
  # Versions of tools that Dependabot cannot follow; check them monthly.
  GOLANGCI_LINT_VERSION: v2.15.0
  CFN_LINT_VERSION: 1.57.2
  # Node.js of the CDK tests, and Prettier for the embedded helper.
  NODE_VERSION: 22.23.4
  PRETTIER_VERSION: 3.9.10
  # The test CDK app the tests copy; npm ci installs it before the tests.
  CDK_TEST_APP: internal/cdk/testdata/apps/ts-minimal

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable, oldstable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.CDK_TEST_APP }}/package-lock.json
      - name: Install the test CDK app
        working-directory: ${{ env.CDK_TEST_APP }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test (acceptance, unit, performance, output guard, IAM example)
        env:
          # As the published binaries (U8 NFR9.12); only the race job turns cgo on.
          CGO_ENABLED: "0"
        run: go test -mod=readonly ./...

  race:
    # The race detector needs cgo and a C compiler, which only this Linux job
    # turns on; the other jobs and the published binaries keep CGO_ENABLED=0
    # (NFR5.7).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.CDK_TEST_APP }}/package-lock.json
      - name: Install the test CDK app
        working-directory: ${{ env.CDK_TEST_APP }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test with the race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race -mod=readonly ./...

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.CDK_TEST_APP }}/package-lock.json
      - name: Install the test CDK app
        working-directory: ${{ env.CDK_TEST_APP }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Measure statement coverage of cmd and internal
        run: |
          go test -mod=readonly -coverpkg=./cmd/tag-refactor/...,./internal/... -coverprofile=coverage.out ./cmd/tag-refactor/... ./internal/...
          go tool cover -func=coverage.out | tail -n 1
      - name: Require at least 80%
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $NF); print $NF}')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t >= 80.0) ? 0 : 1 }' || { echo "coverage ${total}% is below 80%"; exit 1; }

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "not formatted with gofmt:"; echo "$unformatted"; exit 1; fi
      - name: golangci-lint (default linters)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: Type-check the sandbox account test (not run)
        run: go vet -mod=readonly -tags integration ./...
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: cfn-lint
        run: |
          python -m pip install --disable-pip-version-check "cfn-lint==${CFN_LINT_VERSION}"
          cfn-lint test/sandbox/*-fixtures.yaml
      - name: cfn-lint of a template iac rewrote (U8 NFR3.21)
        # The binary is built first: go run answers 1 for any exit code of the
        # program, and iac has to be told apart by 0 and 2.
        run: |
          go build -mod=readonly -o "$RUNNER_TEMP/tag-refactor" ./cmd/tag-refactor
          repo="$RUNNER_TEMP/u8-repo"
          empty="$RUNNER_TEMP/u8-empty"
          mkdir -p "$repo" "$empty"
          cp test/sandbox/* "$repo"/
          export GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
          git init -q --template="$empty" "$repo"
          git -C "$repo" -c core.autocrlf=false add -A
          git -C "$repo" -c core.autocrlf=false -c commit.gpgsign=false -c core.hooksPath="$empty" \
            -c user.name=ci -c user.email=ci@example.invalid commit -q -m "copy of test/sandbox"
          status=0
          "$RUNNER_TEMP/tag-refactor" iac --lang en --plan internal/iac/testdata/sandbox-plan.json --dir "$repo" --write || status=$?
          if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then echo "iac ended with exit code $status"; exit 1; fi
          stat="$(git -C "$repo" diff --numstat)"
          want="$(printf '4\t4\tu6-fixtures.yaml')"
          if [ "$stat" != "$want" ]; then echo "the difference of iac is not 4 lines of u6-fixtures.yaml: $stat"; exit 1; fi
          cfn-lint "$repo/u6-fixtures.yaml"

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: govulncheck (version pinned by the tool directive in go.mod)
        run: go tool govulncheck ./...

  modcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: go mod verify
        run: go mod verify
      - name: go mod tidy leaves no difference
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Build a single static binary
        env:
          CGO_ENABLED: "0"
        run: go build -mod=readonly -trimpath -o "build/tag-refactor$(go env GOEXE)" ./cmd/tag-refactor
      - name: Run --help from an empty directory
        run: |
          exe="tag-refactor$(go env GOEXE)"
          empty="$RUNNER_TEMP/empty-dir"
          mkdir -p "$empty"
          cp "build/$exe" "$empty/"
          cd "$empty"
          "./$exe" --help

  prettier:
    # The format of the embedded helper (team code style, NFR6.8).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Prettier --check of the helper and of the verification files
        run: npm exec --yes "prettier@${PRETTIER_VERSION}" -- --check internal/cdk/helper/ "test/verify/*.js"

  github-pr:
    # The integration test with the real GitHub (AC1.1.11, NFR9.1). The secret
    # and the variable go to the env of its one step only; without the secret
    # (pull requests from forks, Dependabot) the test is skipped and the job
    # passes.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.CDK_TEST_APP }}/package-lock.json
      - name: Install the test CDK app
        working-directory: ${{ env.CDK_TEST_APP }}
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Open and close a pull request in the test-only repository
        env:
          CGO_ENABLED: "0"
          TAG_REFACTOR_TEST_REPO: ${{ vars.TAG_REFACTOR_TEST_REPO }}
          TAG_REFACTOR_TEST_REPO_TOKEN: ${{ secrets.TAG_REFACTOR_TEST_REPO_TOKEN }}
        run: go test -mod=readonly -count=1 -run '^TestGitHubPullRequest$' ./internal/cli/

  ci-gate:
    # The only required status check: it passes only when every job passed.
    if: always()
    needs: [test, race, coverage, lint, vuln, modcheck, build, prettier, github-pr]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the results of all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then echo "a required job did not succeed"; exit 1; fi
          done

  artifacts:
    # Binaries for checking main; kept for 7 days and never published.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Cross-build for Linux, macOS and Windows
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"; ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            GOOS="$os" GOARCH="$arch" go build -mod=readonly -trimpath -o "dist/tag-refactor_${os}_${arch}${ext}" ./cmd/tag-refactor
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tag-refactor-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
