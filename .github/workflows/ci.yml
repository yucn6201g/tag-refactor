# CI for tag-refactor (U1, U2). It never calls AWS and holds no AWS credentials.
# Branch protection requires only the ci-gate job.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Never let Go download another toolchain; the matrix decides the version.
  GOTOOLCHAIN: local
  # Versions of tools that Dependabot cannot follow; check them monthly.
  GOLANGCI_LINT_VERSION: v2.15.0
  CFN_LINT_VERSION: 1.57.2

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable, oldstable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Test (acceptance, unit, performance, output guard, IAM example)
        run: go test -mod=readonly ./...

  race:
    # The race detector needs cgo and a C compiler, which only this Linux job
    # turns on; the other jobs and the published binaries keep CGO_ENABLED=0
    # (NFR5.7).
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Test with the race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race -mod=readonly ./...

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Measure statement coverage of cmd and internal
        run: |
          go test -mod=readonly -coverpkg=./cmd/tag-refactor/...,./internal/... -coverprofile=coverage.out ./cmd/tag-refactor/... ./internal/...
          go tool cover -func=coverage.out | tail -n 1
      - name: Require at least 80%
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $NF); print $NF}')
          echo "total coverage: ${total}%"
          awk -v t="$total" 'BEGIN { exit (t >= 80.0) ? 0 : 1 }' || { echo "coverage ${total}% is below 80%"; exit 1; }

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "not formatted with gofmt:"; echo "$unformatted"; exit 1; fi
      - name: golangci-lint (default linters)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
      - name: Type-check the sandbox account test (not run)
        run: go vet -mod=readonly -tags integration ./...
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: cfn-lint
        run: |
          python -m pip install --disable-pip-version-check "cfn-lint==${CFN_LINT_VERSION}"
          cfn-lint test/sandbox/*-fixtures.yaml

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: govulncheck (version pinned by the tool directive in go.mod)
        run: go tool govulncheck ./...

  modcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: go mod verify
        run: go mod verify
      - name: go mod tidy leaves no difference
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Build a single static binary
        env:
          CGO_ENABLED: "0"
        run: go build -mod=readonly -trimpath -o "build/tag-refactor$(go env GOEXE)" ./cmd/tag-refactor
      - name: Run --help from an empty directory
        run: |
          exe="tag-refactor$(go env GOEXE)"
          empty="$RUNNER_TEMP/empty-dir"
          mkdir -p "$empty"
          cp "build/$exe" "$empty/"
          cd "$empty"
          "./$exe" --help

  ci-gate:
    # The only required status check: it passes only when every job passed.
    if: always()
    needs: [test, race, coverage, lint, vuln, modcheck, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the results of all jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then echo "a required job did not succeed"; exit 1; fi
          done

  artifacts:
    # Binaries for checking main; kept for 7 days and never published.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Cross-build for Linux, macOS and Windows
        env:
          CGO_ENABLED: "0"
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"; ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            GOOS="$os" GOARCH="$arch" go build -mod=readonly -trimpath -o "dist/tag-refactor_${os}_${arch}${ext}" ./cmd/tag-refactor
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tag-refactor-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
