# Release of tag-refactor (US6.2, NFR12). Only a person publishes, by pushing
# a tag vX.Y.Z that is on main (team.md Deployment). Pull requests that touch
# the release, and workflow_dispatch, run every step except publishing, as a
# dry run. Binaries are built with CGO_ENABLED=0 and -trimpath, archived with
# the licenses, and listed in a SHA-256 checksum file. No signing and no
# provenance attestation (team decision). It never calls AWS and holds no AWS
# credentials.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/third-party-notices.sh
      - go.mod
      - go.sum
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Never let Go download another toolchain; setup-go decides the version.
  GOTOOLCHAIN: local
  # The oldest Go whose standard library govulncheck reports nothing for.
  MIN_GO: go1.27.3

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.archive.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Tags and main: Go reads the version from the tag, and the tag
          # must be on main.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Require Go ${{ env.MIN_GO }} or later
        run: |
          have=$(go env GOVERSION)
          oldest=$(printf '%s\n' "$MIN_GO" "$have" | sort -V | head -n 1)
          if [ "$oldest" != "$MIN_GO" ]; then echo "Go $have is older than $MIN_GO"; exit 1; fi
          echo "building with $have"
      - name: Require a vX.Y.Z tag on main
        if: github.event_name == 'push'
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1
          fi
      - name: Test (no AWS calls)
        run: go test -mod=readonly ./...
      - name: govulncheck with the Go that builds the binaries
        run: go tool govulncheck ./...
      - name: Build for every OS and CPU
        env:
          CGO_ENABLED: "0"
        run: |
          # Outside the checkout, so the working tree stays clean and Go does
          # not mark the version "+dirty".
          work="$RUNNER_TEMP/release"
          mkdir -p "$work"
          bash scripts/third-party-notices.sh "$work/THIRD_PARTY_NOTICES.txt"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"; ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            stage="$work/${os}_${arch}"
            mkdir -p "$stage"
            GOOS="$os" GOARCH="$arch" go build -mod=readonly -trimpath -o "$stage/tag-refactor$ext" ./cmd/tag-refactor
            cp LICENSE README.md "$work/THIRD_PARTY_NOTICES.txt" "$stage/"
          done
      - name: Check the version stamped by Go
        id: archive
        run: |
          work="$RUNNER_TEMP/release"
          info=$(go version -m "$work/linux_amd64/tag-refactor")
          version=$(awk '$1 == "mod" { print $3 }' <<<"$info")
          echo "version: $version"
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            if [ "$version" != "$GITHUB_REF_NAME" ]; then echo "binary version $version is not the tag $GITHUB_REF_NAME"; exit 1; fi
          elif [ -z "$version" ] || [ "$version" = "(devel)" ]; then
            echo "Go stamped no version"; exit 1
          fi
          if [[ "$version" == *+dirty ]] || ! grep -q 'vcs.modified=false' <<<"$info"; then
            echo "the working tree was modified"; exit 1
          fi
          got=$("$work/linux_amd64/tag-refactor" --version)
          if [ "$got" != "tag-refactor $version" ]; then echo "--version printed \"$got\""; exit 1; fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Archive with the licenses and write the checksums
        env:
          VERSION: ${{ steps.archive.outputs.version }}
        run: |
          work="$RUNNER_TEMP/release"
          mkdir -p dist
          for stage in "$work"/*_*/; do
            target=$(basename "$stage")
            name="tag-refactor_${VERSION}_${target}"
            if [[ "$target" == windows_* ]]; then
              (cd "$stage" && zip -q -X "$GITHUB_WORKSPACE/dist/$name.zip" tag-refactor.exe LICENSE README.md THIRD_PARTY_NOTICES.txt)
            else
              tar -C "$stage" --owner=0 --group=0 --numeric-owner -czf "dist/$name.tar.gz" tag-refactor LICENSE README.md THIRD_PARTY_NOTICES.txt
            fi
          done
          (cd dist && sha256sum -- * >"$work/checksums.txt")
          mv "$work/checksums.txt" "dist/tag-refactor_${VERSION}_checksums.txt"
          count=$(ls dist | grep -c -e '\.tar\.gz$' -e '\.zip$')
          if [ "$count" -ne 6 ]; then echo "expected 6 archives, found $count"; exit 1; fi
          (cd dist && sha256sum -c "tag-refactor_${VERSION}_checksums.txt")
          {
            echo "### tag-refactor $VERSION"
            if [ "$GITHUB_EVENT_NAME" != "push" ]; then echo "Dry run: nothing is published."; fi
            echo '```'
            cat "dist/tag-refactor_${VERSION}_checksums.txt"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  smoke:
    # AC6.2.1 and AC6.2.3 on each OS: the checksums match, and the binary
    # runs from an empty directory with nothing else installed for it.
    name: smoke (${{ matrix.target }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux_amd64, archive: tar.gz, exe: tag-refactor }
          - { os: macos-latest, target: darwin_arm64, archive: tar.gz, exe: tag-refactor }
          - { os: windows-latest, target: windows_amd64, archive: zip, exe: tag-refactor.exe }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Verify the checksums
        env:
          VERSION: ${{ needs.build.outputs.version }}
        working-directory: dist
        run: |
          sum="tag-refactor_${VERSION}_checksums.txt"
          if command -v sha256sum >/dev/null; then sha256sum -c "$sum"; else shasum -a 256 -c "$sum"; fi
      - name: Run the binary from an empty directory
        env:
          VERSION: ${{ needs.build.outputs.version }}
          ARCHIVE: tag-refactor_${{ needs.build.outputs.version }}_${{ matrix.target }}.${{ matrix.archive }}
          EXE: ${{ matrix.exe }}
        run: |
          empty="$RUNNER_TEMP/empty-dir"
          mkdir -p "$empty"
          case "$ARCHIVE" in
            *.zip) unzip -q "dist/$ARCHIVE" -d "$empty" ;;
            *) tar -xzf "dist/$ARCHIVE" -C "$empty" ;;
          esac
          cd "$empty"
          ls -l
          for f in LICENSE README.md THIRD_PARTY_NOTICES.txt; do test -s "$f"; done
          got=$("./$EXE" --version | tr -d '\r')
          if [ "$got" != "tag-refactor $VERSION" ]; then echo "--version printed \"$got\""; exit 1; fi
          "./$EXE" --help >/dev/null
          echo "$got runs on $RUNNER_OS"

  publish:
    # Only a pushed vX.Y.Z tag publishes; a re-run fails if the release exists.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes
