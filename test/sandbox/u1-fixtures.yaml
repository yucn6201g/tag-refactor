AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  tag-refactor U1 checkpoint fixtures - SQS queues, an empty S3 bucket, and IAM
  policies and roles used to check scan and plan. Deploy only to a personal
  sandbox account in ap-northeast-1 with the stack tag project=tag-refactor-fixture,
  and delete the stack after the check. Every name is generated by
  CloudFormation. Intrinsic functions use the long form (Fn::GetAtt, Fn::Sub,
  Ref) so the file is plain YAML.

Parameters:
  SsoPermissionSetName:
    Type: String
    Description: >-
      Name of the IAM Identity Center permission set whose role may assume R1
      and R2 (the part between AWSReservedSSO_ and the suffix).
    AllowedPattern: "[\\w+=,.@-]+"
    MinLength: 1
    MaxLength: 32

Resources:
  # QA: rename env -> Environment (BR4.1).
  QA:
    Type: AWS::SQS::Queue
    Properties:
      Tags:
        - Key: env
          Value: dev

  # QB: the key variant group env / Env (BR2.2) and Env -> Environment.
  QB:
    Type: AWS::SQS::Queue
    Properties:
      Tags:
        - Key: Env
          Value: dev

  # QC: a conflict, env=dev and Environment=prod (BR4.2).
  QC:
    Type: AWS::SQS::Queue
    Properties:
      Tags:
        - Key: env
          Value: dev
        - Key: Environment
          Value: prod

  # B1: another resource type, and the separator variants cost-center / cost_center.
  B1:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: env
          Value: dev
        - Key: cost-center
          Value: a
        - Key: cost_center
          Value: b

  # P1: attached to R1; aws:ResourceTag/env is affected by the rename (BR5.3).
  # It also lets the checkpoint confirm that the condition matches the Env tag
  # of QB (tag keys are not case-sensitive in aws:ResourceTag).
  P1:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: tag-refactor U1 fixture P1 - aws:ResourceTag/env condition
      Roles:
        - Ref: R1
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowDevQueues
            Effect: Allow
            Action: sqs:GetQueueAttributes
            Resource:
              - Fn::GetAtt: [QA, Arn]
              - Fn::GetAtt: [QB, Arn]
            Condition:
              StringEquals:
                aws:ResourceTag/env: dev

  # P2: attached to R1; a service-specific condition key (BR5.2) and a policy
  # variable in the key (BR5.4). It only allows reading a queue that does not
  # exist. If IAM rejects the policy variable statement, remove that statement
  # (infrastructure-specification.md, R-03).
  P2:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: tag-refactor U1 fixture P2 - service-specific key and policy variable
      Roles:
        - Ref: R1
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ServiceSpecificKey
            Effect: Allow
            Action: sqs:GetQueueAttributes
            Resource:
              Fn::Sub: arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:tag-refactor-nonexistent
            Condition:
              StringEquals:
                ec2:ResourceTag/env: dev
          - Sid: PolicyVariableKey
            Effect: Allow
            Action: sqs:GetQueueAttributes
            Resource:
              Fn::Sub: arn:${AWS::Partition}:sqs:${AWS::Region}:${AWS::AccountId}:tag-refactor-nonexistent
            Condition:
              StringEquals:
                aws:ResourceTag/${aws:PrincipalTag/team}: dev

  # P3: not attached; plan must not read it (BR5.1).
  P3:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: tag-refactor U1 fixture P3 - not attached to anything
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowDevQueues
            Effect: Allow
            Action: sqs:GetQueueAttributes
            Resource:
              - Fn::GetAtt: [QA, Arn]
              - Fn::GetAtt: [QB, Arn]
            Condition:
              StringEquals:
                aws:ResourceTag/env: dev

  # R1: makes P1 and P2 "attached"; assumed at the checkpoint to test P1.
  R1:
    Type: AWS::IAM::Role
    Properties:
      Description: tag-refactor U1 fixture R1 - holds P1 and P2
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowSandboxSsoRole
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-reserved/sso.amazonaws.com/*/AWSReservedSSO_${SsoPermissionSetName}_*
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-reserved/sso.amazonaws.com/AWSReservedSSO_${SsoPermissionSetName}_*

  # R2: read-only role with exactly docs/iam/readonly-policy.json (NFR3.2),
  # where the file's <account-id> placeholder is this account. A test keeps
  # this inline policy equal to that file.
  R2:
    Type: AWS::IAM::Role
    Properties:
      Description: tag-refactor U1 fixture R2 - only the documented read-only policy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowSandboxSsoRole
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-reserved/sso.amazonaws.com/*/AWSReservedSSO_${SsoPermissionSetName}_*
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-reserved/sso.amazonaws.com/AWSReservedSSO_${SsoPermissionSetName}_*
      Policies:
        - PolicyName: tag-refactor-readonly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: TagRefactorReadOnly
                Effect: Allow
                Action:
                  - ec2:DescribeRegions
                  - tag:GetResources
                  - iam:ListPolicies
                  - config:DescribeConfigurationRecorders
                  - config:DescribeConfigurationRecorderStatus
                  - config:SelectResourceConfig
                  - resource-explorer-2:ListIndexes
                  - resource-explorer-2:GetDefaultView
                  - resource-explorer-2:GetView
                  - resource-explorer-2:Search
                Resource: "*"
              - Sid: TagRefactorReadCustomerPolicies
                Effect: Allow
                Action:
                  - iam:GetPolicyVersion
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/*

Outputs:
  R1Arn:
    Description: Role holding P1 and P2 (assume it to check P1 against QB)
    Value:
      Fn::GetAtt: [R1, Arn]
  R2Arn:
    Description: Read-only role for the tag-refactor-readonly profile
    Value:
      Fn::GetAtt: [R2, Arn]
  QBArn:
    Description: Queue tagged Env=dev
    Value:
      Fn::GetAtt: [QB, Arn]
