AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  tag-refactor U2 checkpoint fixtures - a local Resource Explorer index and an
  unfiltered default view in ap-northeast-1, so scan can find never-tagged
  resources with ListResources. Resource Explorer costs nothing; AWS Config
  recording is deliberately not turned on. Deploy only to a personal sandbox
  account in ap-northeast-1 with the stack tag project=tag-refactor-fixture.
  The never-tagged queue is created and deleted by scripts/verify.sh, because
  CloudFormation would tag it.

Parameters:
  CreateIndex:
    Type: String
    Description: >-
      true to create the local index (IX). Pass false when the region already
      has an index; check with aws resource-explorer-2 list-indexes.
    AllowedValues: ["true", "false"]
    Default: "true"
  CreateDefaultView:
    Type: String
    Description: >-
      true to create the view (VW) and make it the default view of the region
      (DV). Pass false when the region already has a default view without a
      filter; check with aws resource-explorer-2 get-default-view.
    AllowedValues: ["true", "false"]
    Default: "true"

Conditions:
  MakeIndex:
    Fn::Equals: [Ref: CreateIndex, "true"]
  MakeView:
    Fn::Equals: [Ref: CreateDefaultView, "true"]
  MakeViewAfterIndex:
    Fn::And: [Condition: MakeIndex, Condition: MakeView]
  MakeViewOnly:
    Fn::And:
      - Fn::Not: [Condition: MakeIndex]
      - Condition: MakeView

Resources:
  # IX: the local index of ap-northeast-1 (BR3.1, the Resource Explorer path).
  # Filling it can take up to an hour after creation.
  IX:
    Type: AWS::ResourceExplorer2::Index
    Condition: MakeIndex
    Properties:
      Type: LOCAL

  # VW: a view without a filter, so ListResources sees every resource. It is
  # created after IX when the stack creates both, and alone when the index
  # already exists (CloudFormation cannot make DependsOn conditional).
  VW:
    Type: AWS::ResourceExplorer2::View
    Condition: MakeViewAfterIndex
    DependsOn: IX
    Properties:
      ViewName: tag-refactor-u2-default
      # tag:none needs the tags property in the view.
      IncludedProperties:
        - Name: tags

  VWOnly:
    Type: AWS::ResourceExplorer2::View
    Condition: MakeViewOnly
    Properties:
      ViewName: tag-refactor-u2-default
      IncludedProperties:
        - Name: tags

  # DV: makes the view the default view of the region (GetDefaultView).
  DV:
    Type: AWS::ResourceExplorer2::DefaultViewAssociation
    Condition: MakeView
    Properties:
      ViewArn:
        Fn::If:
          - MakeViewAfterIndex
          - Ref: VW
          - Ref: VWOnly

Outputs:
  DefaultViewArn:
    Condition: MakeView
    Description: The default view created by this stack
    Value:
      Fn::If:
        - MakeViewAfterIndex
        - Ref: VW
        - Ref: VWOnly
