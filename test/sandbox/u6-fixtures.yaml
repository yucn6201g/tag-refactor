AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  tag-refactor U6 checkpoint fixtures - a security group in an empty VPC to
  rewrite, a bucket for run records in S3, and the role R3 with exactly the
  example policy docs/iam/apply-policy.json, used to check apply. Deploy
  only to a personal sandbox account in ap-northeast-1 with the stack tag
  project=tag-refactor-fixture, and delete the stack after the check (empty
  the bucket first). Every name is generated by CloudFormation. Intrinsic
  functions use the long form (Fn::GetAtt, Fn::Sub, Ref) so the file is
  plain YAML.

Parameters:
  SsoPermissionSetName:
    Type: String
    Description: >-
      Name of the IAM Identity Center permission set whose role may assume
      R3 (the part between AWSReservedSSO_ and the suffix), as for the U1
      stack.
    AllowedPattern: "[\\w+=,.@-]+"
    MinLength: 1
    MaxLength: 32

Resources:
  # VU6: a VPC only for GU6, without subnets, gateways or NAT (no cost).
  VU6:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.66.0.0/16
      Tags:
        - Key: project
          Value: tag-refactor-fixture

  # GU6: a security group that accepts nothing, the EC2 resource apply
  # rewrites.
  GU6:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: tag-refactor U6 fixture GU6 - accepts nothing
      VpcId:
        Ref: VU6
      Tags:
        - Key: project
          Value: tag-refactor-fixture

  # BU6R: the bucket of the run records of the third apply
  # (--record-to s3://<BU6R>/runs): no public access, SSE-S3 by default, no
  # ACLs, no versioning.
  BU6R:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  # BU6RPolicy: denies requests without TLS, like BU5.
  BU6RPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: BU6R
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - Fn::GetAtt: [BU6R, Arn]
              - Fn::Sub: arn:${AWS::Partition}:s3:::${BU6R}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # R3: the role of apply with exactly docs/iam/apply-policy.json, where
  # <account-id> is this account, <record-bucket> is BU6R and
  # <record-prefix> is runs. A test keeps this inline policy equal to that
  # file. The trust policy is that of R2.
  R3:
    Type: AWS::IAM::Role
    Properties:
      Description: tag-refactor U6 fixture R3 - only the documented apply policy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowSandboxSsoRole
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-reserved/sso.amazonaws.com/*/AWSReservedSSO_${SsoPermissionSetName}_*
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-reserved/sso.amazonaws.com/AWSReservedSSO_${SsoPermissionSetName}_*
      Policies:
        - PolicyName: tag-refactor-apply
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: TagRefactorReadOnly
                Effect: Allow
                Action:
                  - ec2:DescribeRegions
                  - tag:GetResources
                  - iam:GetAccountAuthorizationDetails
                  - config:DescribeConfigurationRecorders
                  - config:DescribeConfigurationRecorderStatus
                  - config:SelectResourceConfig
                  - resource-explorer-2:ListIndexes
                  - resource-explorer-2:GetDefaultView
                  - resource-explorer-2:GetView
                  - resource-explorer-2:Search
                  - s3:ListAllMyBuckets
                  - kms:ListKeys
                  - sqs:ListQueues
                  - sns:ListTopics
                  - secretsmanager:ListSecrets
                Resource: "*"
              - Sid: TagRefactorReadBucketPolicies
                Effect: Allow
                Action:
                  - s3:GetBucketPolicy
                  - s3:GetBucketLocation
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::*
              - Sid: TagRefactorReadKeyPolicies
                Effect: Allow
                Action:
                  - kms:DescribeKey
                  - kms:GetKeyPolicy
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:kms:*:${AWS::AccountId}:key/*
              - Sid: TagRefactorReadQueuePolicies
                Effect: Allow
                Action:
                  - sqs:GetQueueAttributes
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:sqs:*:${AWS::AccountId}:*
              - Sid: TagRefactorReadTopicPolicies
                Effect: Allow
                Action:
                  - sns:GetTopicAttributes
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:sns:*:${AWS::AccountId}:*
              - Sid: TagRefactorReadSecretPolicies
                Effect: Allow
                Action:
                  - secretsmanager:GetResourcePolicy
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:secretsmanager:*:${AWS::AccountId}:secret:*
              - Sid: TagRefactorTaggingAPI
                Effect: Allow
                Action:
                  - tag:TagResources
                  - tag:UntagResources
                Resource: "*"
              - Sid: TagRefactorTagEC2
                Effect: Allow
                Action:
                  - ec2:CreateTags
                  - ec2:DeleteTags
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:ec2:*:${AWS::AccountId}:*
                  - Fn::Sub: arn:${AWS::Partition}:ec2:*::snapshot/*
                  - Fn::Sub: arn:${AWS::Partition}:ec2:*::image/*
              - Sid: TagRefactorTagS3Buckets
                Effect: Allow
                Action:
                  - s3:GetBucketTagging
                  - s3:PutBucketTagging
                  - s3:TagResource
                  - s3:UntagResource
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:s3:::*
              - Sid: TagRefactorTagSQS
                Effect: Allow
                Action:
                  - sqs:TagQueue
                  - sqs:UntagQueue
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:sqs:*:${AWS::AccountId}:*
              - Sid: TagRefactorTagSNS
                Effect: Allow
                Action:
                  - sns:TagResource
                  - sns:UntagResource
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:sns:*:${AWS::AccountId}:*
              - Sid: TagRefactorTagSecretsManager
                Effect: Allow
                Action:
                  - secretsmanager:TagResource
                  - secretsmanager:UntagResource
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:secretsmanager:*:${AWS::AccountId}:secret:*
              - Sid: TagRefactorTagIAM
                Effect: Allow
                Action:
                  - iam:TagRole
                  - iam:TagUser
                  - iam:TagPolicy
                  - iam:UntagRole
                  - iam:UntagUser
                  - iam:UntagPolicy
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/*
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:user/*
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:policy/*
              - Sid: TagRefactorTagKMS
                Effect: Allow
                Action:
                  - kms:TagResource
                  - kms:UntagResource
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:kms:*:${AWS::AccountId}:key/*
              - Sid: TagRefactorTagLambda
                Effect: Allow
                Action:
                  - lambda:TagResource
                  - lambda:UntagResource
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:lambda:*:${AWS::AccountId}:function:*
              - Sid: TagRefactorTagDynamoDB
                Effect: Allow
                Action:
                  - dynamodb:TagResource
                  - dynamodb:UntagResource
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:dynamodb:*:${AWS::AccountId}:table/*
              - Sid: TagRefactorTagLogs
                Effect: Allow
                Action:
                  - logs:TagResource
                  - logs:TagLogGroup
                  - logs:UntagResource
                  - logs:UntagLogGroup
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:logs:*:${AWS::AccountId}:log-group:*
              - Sid: TagRefactorTagRDS
                Effect: Allow
                Action:
                  - rds:AddTagsToResource
                  - rds:RemoveTagsFromResource
                Resource:
                  - Fn::Sub: arn:${AWS::Partition}:rds:*:${AWS::AccountId}:*
              - Sid: TagRefactorRecordObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::${BU6R}/runs/*
              - Sid: TagRefactorRecordList
                Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::${BU6R}
                Condition:
                  StringLike:
                    s3:prefix: runs/*

Outputs:
  ApplyRoleArn:
    Description: ARN of R3, for the profile tag-refactor-apply.
    Value:
      Fn::GetAtt: [R3, Arn]
  SecurityGroupArn:
    Description: ARN of GU6, one of the resources apply rewrites.
    Value:
      Fn::Sub: arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:security-group/${GU6.GroupId}
  RecordBucket:
    Description: Name of BU6R, the bucket of the run records in S3.
    Value:
      Ref: BU6R
