AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  tag-refactor U5 checkpoint fixtures - an IAM role with an inline policy, an
  SQS queue it reads, and an S3 bucket, an SNS topic and a Secrets Manager
  secret with resource policies that use aws:ResourceTag/env, used to check
  the impact analysis of plan. Deploy only to a personal sandbox account in
  ap-northeast-1 with the stack tag project=tag-refactor-fixture, and delete
  the stack after the check. Every name is generated by CloudFormation.
  Intrinsic functions use the long form (Fn::GetAtt, Fn::Sub, Ref) so the
  file is plain YAML.

Parameters:
  SsoPermissionSetName:
    Type: String
    Description: >-
      Name of the IAM Identity Center permission set whose role may assume
      RU5 (the part between AWSReservedSSO_ and the suffix), as for the U1
      stack.
    AllowedPattern: "[\\w+=,.@-]+"
    MinLength: 1
    MaxLength: 32

Resources:
  # RU5: a role with the tags env=dev and team=data and the inline policy
  # u5-inline. The second statement keeps ${aws:PrincipalTag/team} for IAM
  # (written ${!...} so CloudFormation does not replace it).
  RU5:
    Type: AWS::IAM::Role
    Properties:
      Description: tag-refactor U5 fixture RU5 - inline policy with aws:ResourceTag/env and a policy variable
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowSandboxSsoRole
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: sts:AssumeRole
            Condition:
              ArnLike:
                aws:PrincipalArn:
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-reserved/sso.amazonaws.com/*/AWSReservedSSO_${SsoPermissionSetName}_*
                  - Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-reserved/sso.amazonaws.com/AWSReservedSSO_${SsoPermissionSetName}_*
      Policies:
        - PolicyName: u5-inline
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadDevQueue
                Effect: Allow
                Action: sqs:GetQueueAttributes
                Resource:
                  Fn::GetAtt: [QU5, Arn]
                Condition:
                  StringEquals:
                    aws:ResourceTag/env: dev
              - Sid: ReadTeamPrefix
                Effect: Allow
                Action: s3:GetObject
                Resource:
                  Fn::Sub: arn:${AWS::Partition}:s3:::${BU5}/${!aws:PrincipalTag/team}/*
      Tags:
        - Key: env
          Value: dev
        - Key: team
          Value: data

  # BU5: an empty bucket like B1 of the U1 stack.
  BU5:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: env
          Value: dev

  # BU5Policy: denies only requests without TLS, and only while the bucket
  # has env=dev, so it never stops the user's own work.
  BU5Policy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket:
        Ref: BU5
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransportWhileDev
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - Fn::GetAtt: [BU5, Arn]
              - Fn::Sub: arn:${AWS::Partition}:s3:::${BU5}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"
              StringEquals:
                aws:ResourceTag/env: dev

  # No KMS key: KMS refuses a key policy with aws:ResourceTag ("These
  # condition keys are not permitted in a key policy"), so key policies are
  # checked with the fake AWS only (NFR2.1).

  QU5:
    Type: AWS::SQS::Queue
    Properties:
      SqsManagedSseEnabled: true
      Tags:
        - Key: env
          Value: dev

  # QU5 has no queue policy: SQS refuses aws:ResourceTag in a queue policy
  # ("Conditions must be from Global context key list"), so queue policies
  # are checked with the fake AWS only (NFR2.1). The queue stays for the
  # inline policy of RU5.

  TU5:
    Type: AWS::SNS::Topic
    Properties:
      Tags:
        - Key: env
          Value: dev

  TU5Policy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - Ref: TU5
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ReadAttributesWhileDev
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: sns:GetTopicAttributes
            Resource:
              Ref: TU5
            Condition:
              StringEquals:
                aws:ResourceTag/env: dev

  # SU5: its value is generated and never read; only its resource policy
  # matters.
  SU5:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: tag-refactor U5 fixture SU5 - resource policy with aws:ResourceTag/env
      GenerateSecretString:
        PasswordLength: 32
      Tags:
        - Key: env
          Value: dev

  SU5Policy:
    Type: AWS::SecretsManager::ResourcePolicy
    Properties:
      SecretId:
        Ref: SU5
      BlockPublicPolicy: true
      ResourcePolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: DescribeWhileDev
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: secretsmanager:DescribeSecret
            Resource: "*"
            Condition:
              StringEquals:
                aws:ResourceTag/env: dev

Outputs:
  RoleArn:
    Description: Role holding the inline policy u5-inline
    Value:
      Fn::GetAtt: [RU5, Arn]
  BucketArn:
    Description: Bucket with the bucket policy
    Value:
      Fn::GetAtt: [BU5, Arn]
  TopicArn:
    Description: Topic with the topic policy
    Value:
      Ref: TU5
  SecretArn:
    Description: Secret with the resource policy
    Value:
      Ref: SU5
